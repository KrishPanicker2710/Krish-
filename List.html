<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h2> An Ordered HTML List </h2>
    <ol>
        <li>Toyota</li>
        <li>Lamborgini</li>
        <li>Bugatti</li>
        <li>Ferrari</li>
    </ol>
    <h2> An Unordered HTML List </h2>
    <ol>
        <li>Grocery</li>
        <li>Toys</li>
        <li>Books</li>
        <li>Tools</li>
    </ol>
    <h2> A Definition HTML List </h2>
    <dl>
        <dt> Tea </dt>
        <dd> Hot Drink </dd>

        <dt> Juice </dt>
        <dd> Cold Drink </dd>
    </dl>
</body>
</html>
