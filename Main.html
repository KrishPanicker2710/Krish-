<!DOCTYPE html>
<html>
    <head>
      <title>Headings</title>
    </head>
    <body>
        <h1> This is the largest font size in html </h1>
        <h2> This is a font size smaller than h1 </h2>
        <h3> This is font size smaller than h2. </h3>
        <h4> This is font size smaller than h3. </h4>
        <h5> This is font size smaller than h4. </h5>
        <h6> This is the smallest font size in html</h6>
        <p> The p tag is used to represent a paragraph</p>
    </body>
</html>
